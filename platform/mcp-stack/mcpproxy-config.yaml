apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpproxy-config
  namespace: mcp
data:
  config.yaml: |
    listen: 0.0.0.0:8081
    inbound:
      mode: anonymous
    auth_server:
      issuer: https://mcp.tail5389e9.ts.net
      signing_key_file: /var/run/mcpproxy/authserver.pem
      access_token_ttl: 1h
      upstream:
        issuer: https://authentik.tail5389e9.ts.net/application/o/mcp-proxy/
        client_id: mcp-proxy
        client_secret: ${AUTHENTIK_OIDC_CLIENT_SECRET}
        scopes: [openid, email, profile]
    backends:
      context7:
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        auth: none
      grafana:
        transport: streamable-http
        url: http://grafana-mcp.grafana-mcp.svc.cluster.local:8000/mcp
        auth: static
        headers:
          Authorization: Bearer ${GRAFANA_MCP_SERVER_TOKEN}
          Host: grafana-mcp.tail5389e9.ts.net
      ai-memory:
        transport: streamable-http
        url: http://ai-memory.ai-memory.svc.cluster.local:49374/mcp
        auth: static
        headers:
          Authorization: Bearer ${AI_MEMORY_AUTH_TOKEN}
      graphify:
        transport: streamable-http
        url: http://graphify.graphify.svc.cluster.local:8080/mcp
        auth: none
      kanzo:
        transport: streamable-http
        url: http://kanzo.kanzo.svc.cluster.local:4242/mcp
        auth: none
        headers:
          Host: localhost:4242
      watchskill:
        transport: streamable-http
        url: http://watch-skill.watch-skill.svc.cluster.local:8748/mcp
        auth: static
        headers:
          Authorization: Bearer ${WATCHSKILL_MCP_TOKEN}
      graphiti:
        transport: streamable-http
        url: http://graphiti.graphiti.svc.cluster.local:8000/mcp/
        auth: none
      agentbrowser:
        transport: streamable-http
        url: http://agent-browser.agent-browser.svc.cluster.local:8080/mcp
        auth: static
        headers:
          Authorization: Bearer ${AGENT_BROWSER_MCP_TOKEN}
      searxng:
        transport: stdio
        command: [python3, /opt/mcp-servers/searxng-mcp.py]
        env:
          SEARXNG_BASE_URL: http://searxng.search.svc.cluster.local:8080
    policy:
      allowed_tools:
        - searxng_search
        - "context7_resolve-library-id"
        - "context7_query-docs"
        - grafana_check_datasources_health
        - grafana_get_dashboard_by_uid
        - grafana_get_dashboard_panel_queries
        - grafana_get_dashboard_property
        - grafana_get_dashboard_summary
        - grafana_list_dashboard_versions
        - grafana_list_datasources
        - grafana_list_prometheus_label_names
        - grafana_list_prometheus_label_values
        - grafana_list_prometheus_metric_metadata
        - grafana_list_prometheus_metric_names
        - grafana_query_prometheus
        - grafana_query_prometheus_histogram
        - grafana_search_dashboards
        - grafana_search_folders
        - grafana_create_folder
        - grafana_update_dashboard
        - memory_query
        - memory_recent
        - memory_status
        - memory_briefing
        - memory_explore
        - memory_read_page
        - memory_read_session_observations
        - query_graph
        - get_node
        - get_neighbors
        - shortest_path
        - get_community
        - god_nodes
        - graph_stats
        - add_comment
        - create_project
        - create_task
        - get_task
        - link_repo
        - list_projects
        - list_tasks
        - next_task
        - update_task
        - watch_video
        - ask_video
        - get_moment
        - graphiti_search_nodes
        - graphiti_search_memory_facts
        - graphiti_get_episode_entities
        - graphiti_get_entity_edge
        - graphiti_get_episodes
        - graphiti_get_status
        - agentbrowser_agent_browser_open
        - agentbrowser_agent_browser_read
        - agentbrowser_agent_browser_back
        - agentbrowser_agent_browser_forward
        - agentbrowser_agent_browser_reload
        - agentbrowser_agent_browser_snapshot
        - agentbrowser_agent_browser_click
        - agentbrowser_agent_browser_fill
        - agentbrowser_agent_browser_type
        - agentbrowser_agent_browser_press
        - agentbrowser_agent_browser_check
        - agentbrowser_agent_browser_uncheck
        - agentbrowser_agent_browser_select
        - agentbrowser_agent_browser_scroll
        - agentbrowser_agent_browser_wait_ms
        - agentbrowser_agent_browser_wait_for_selector
        - agentbrowser_agent_browser_wait_for_text
        - agentbrowser_agent_browser_wait_for_load
        - agentbrowser_agent_browser_screenshot
        - agentbrowser_agent_browser_get_text
        - agentbrowser_agent_browser_get_url
        - agentbrowser_agent_browser_get_title
        - agentbrowser_agent_browser_tab_new
        - agentbrowser_agent_browser_tab_list
        - agentbrowser_agent_browser_tab_switch
        - agentbrowser_agent_browser_tab_close
        - agentbrowser_agent_browser_close
      denied_tools: []
      approval_tools: []
      on_rug_pull: kill
      max_result_kb: 256
      max_calls_per_session: 100
    telemetry:
      prometheus_path: /metrics
      otlp_endpoint: alloy.monitoring.svc.cluster.local:4317
      service_name: mcpproxy
  oauth-proxy.py: |
    import http.client
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit

    UPSTREAM_HOST = "127.0.0.1"
    UPSTREAM_PORT = 8081
    PUBLIC_URL = os.environ.get("MCP_PUBLIC_URL", "https://mcp.tail5389e9.ts.net").rstrip("/")
    METADATA_PATHS = {
        "/.well-known/oauth-protected-resource",
        "/.well-known/oauth-protected-resource/mcp",
    }
    HOP_HEADERS = {
        "connection", "keep-alive", "proxy-authenticate", "proxy-authorization",
        "te", "trailers", "transfer-encoding", "upgrade",
    }

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            if urlsplit(self.path).path in METADATA_PATHS:
                body = json.dumps({
                    "resource": PUBLIC_URL + "/mcp",
                    "authorization_servers": [PUBLIC_URL],
                    "scopes_supported": ["openid", "email", "profile"],
                    "resource_name": "Home Server MCP Gateway",
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.send_header("Access-Control-Allow-Origin", "*")
                self.end_headers()
                self.wfile.write(body)
                return
            self._proxy()

        def do_POST(self):
            self._proxy()

        def do_DELETE(self):
            self._proxy()

        def do_OPTIONS(self):
            if urlsplit(self.path).path in METADATA_PATHS:
                self.send_response(204)
                self.send_header("Access-Control-Allow-Origin", "*")
                self.send_header("Access-Control-Allow-Methods", "GET, OPTIONS")
                self.send_header("Access-Control-Allow-Headers", "Content-Type, Authorization")
                self.send_header("Content-Length", "0")
                self.end_headers()
                return
            self.send_error(405)

        def _proxy(self):
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length) if length else None
            headers = {
                key: value for key, value in self.headers.items()
                if key.lower() not in HOP_HEADERS and key.lower() not in {"host", "content-length"}
            }
            headers["Host"] = f"{UPSTREAM_HOST}:{UPSTREAM_PORT}"
            if body is not None:
                headers["Content-Length"] = str(len(body))
            conn = http.client.HTTPConnection(UPSTREAM_HOST, UPSTREAM_PORT, timeout=3600)
            try:
                conn.request(self.command, self.path, body=body, headers=headers)
                upstream = conn.getresponse()
                self.send_response(upstream.status, upstream.reason)
                has_length = False
                for key, value in upstream.getheaders():
                    lower = key.lower()
                    if lower in HOP_HEADERS:
                        continue
                    if lower == "content-length":
                        has_length = True
                    if lower == "www-authenticate" and upstream.status == 401:
                        continue
                    self.send_header(key, value)
                if upstream.status == 401:
                    self.send_header(
                        "WWW-Authenticate",
                        'Bearer resource_metadata="' + PUBLIC_URL + '/.well-known/oauth-protected-resource/mcp"',
                    )
                if not has_length and upstream.status not in (204, 304) and not 100 <= upstream.status < 200:
                    self.send_header("Transfer-Encoding", "chunked")
                self.end_headers()
                if self.command != "HEAD" and upstream.status not in (204, 304) and not 100 <= upstream.status < 200:
                    while True:
                        chunk = upstream.read(65536)
                        if not chunk:
                            break
                        if has_length:
                            self.wfile.write(chunk)
                        else:
                            self.wfile.write(f"{len(chunk):X}\r\n".encode() + chunk + b"\r\n")
                    if not has_length:
                        self.wfile.write(b"0\r\n\r\n")
            except (OSError, http.client.HTTPException) as exc:
                self.close_connection = True
                if not self.wfile.closed:
                    try:
                        self.send_error(502, "MCP upstream unavailable")
                    except OSError:
                        pass
            finally:
                conn.close()

        def log_message(self, fmt, *args):
            # Do not log callback query strings, which can contain OAuth codes.
            print(f"mcp-auth-proxy {self.command} {urlsplit(self.path).path}", flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
