apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: mcp
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanzo-agent-worker
                port:
                  number: 9119
