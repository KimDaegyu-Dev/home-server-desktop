apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-alloy
  namespace: argocd
  labels:
    sourceType: helm
    serverSideApply: "false"
    stage: 76-ai-alloy
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.15.0"
    helm:
      releaseName: alloy
      values: |
        alloy:
          enableReporting: false
          envFrom:
            - secretRef:
                name: langfuse-exporter
          configMap:
            content: |
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  metrics = [otelcol.exporter.prometheus.default.input]
                  traces = [otelcol.exporter.otlphttp.langfuse.input]
                }
              }

              otelcol.auth.basic "langfuse" {
                client_auth {
                  username = sys.env("publicKey")
                  password = sys.env("secretKey")
                }
              }

              otelcol.exporter.otlphttp "langfuse" {
                client {
                  auth = otelcol.auth.basic.langfuse.handler
                  endpoint = "http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel"
                }
              }

              otelcol.exporter.prometheus "default" {
                forward_to = [prometheus.remote_write.prometheus.receiver]
              }

              prometheus.remote_write "prometheus" {
                endpoint {
                  url = "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/write"
                }
              }
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
        controller:
          type: deployment
          replicas: 1
        service:
          enabled: true
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
