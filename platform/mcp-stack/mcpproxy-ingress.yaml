apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  namespace: mcp
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - mcp
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcpproxy
                port:
                  number: 8080
