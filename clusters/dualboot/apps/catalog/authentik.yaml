apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    sourceType: helm
    serverSideApply: "false"
    stage: 40-authentik
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: "2026.8.5"
    helm:
      releaseName: authentik
      values: |
        global:
          image:
            tag: "2026.8.5"
        authentik:
          secret_key: env://AUTHENTIK_SECRET_KEY
          postgresql:
            host: authentik-postgresql
            name: authentik
            user: authentik
            password: env://AUTHENTIK_POSTGRESQL__PASSWORD
        postgresql:
          enabled: false
        blueprints:
          configMaps:
            - authentik-sso-blueprints
        server:
          replicas: 1
          ingress:
            enabled: false
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-config
                  key: secret_key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-config
                  key: postgresql__password
            - name: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: grafana_client_secret
            - name: AUTHENTIK_OIDC_ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: argocd_client_secret
            - name: AUTHENTIK_OIDC_VAULT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: vault_client_secret
        worker:
          replicas: 1
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-config
                  key: secret_key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-config
                  key: postgresql__password
            - name: AUTHENTIK_OIDC_GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: grafana_client_secret
            - name: AUTHENTIK_OIDC_ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: argocd_client_secret
            - name: AUTHENTIK_OIDC_VAULT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-sso-clients
                  key: vault_client_secret
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
