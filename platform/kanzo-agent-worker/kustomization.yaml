apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - worker.yaml
  - hermes-dashboard-ingress.yaml
configMapGenerator:
  - name: kanzo-agent-hermes-config
    namespace: mcp
    files:
      - config.yaml=hermes-config.yaml
  - name: kanzo-agent-worker-code
    namespace: mcp
    files:
      - worker.py=worker.py
      - run_ledger.py=run_ledger.py
      - event_adapter.py=event_adapter.py
      - readonly_executor.py=readonly_executor.py
  - name: kanzo-agent-omh-routing
    namespace: mcp
    files:
      - model-chains.json=model-chains.json
