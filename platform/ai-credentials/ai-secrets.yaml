apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ai
  namespace: langfuse
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: langfuse-vso
    serviceAccount: ai-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
