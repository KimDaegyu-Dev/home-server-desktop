---
- name: Bootstrap Argo CD and the environment root application
  hosts: home_server
  become: true
  gather_facts: false
  vars_files:
    - ../../versions.yml
  vars:
    home_repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Create the Argo CD namespace
      ansible.builtin.shell:
        cmd: |
          /usr/local/bin/k3s kubectl create namespace argocd \
            --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
      register: argocd_namespace
      changed_when: "'created' in argocd_namespace.stdout or 'configured' in argocd_namespace.stdout"

    - name: Install the pinned Argo CD release
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --namespace
          - argocd
          - --server-side
          - --force-conflicts
          - -f
          - "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd }}/manifests/install.yaml"
      register: argocd_install
      changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"

    - name: Configure Argo CD HTTP backend and ApplicationSet progressive syncs
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - patch
          - configmap
          - argocd-cmd-params-cm
          - --namespace=argocd
          - --type=merge
          - --patch
          - '{"data":{"server.insecure":"true","applicationsetcontroller.enable.progressive.syncs":"true"}}'
      register: argocd_http_backend
      changed_when: >-
        'patched' in argocd_http_backend.stdout and
        'no change' not in argocd_http_backend.stdout

    - name: Restart Argo CD server to load its HTTP backend setting
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - restart
          - deployment/argocd-server
          - --namespace=argocd
      when: argocd_http_backend.changed
      changed_when: true

    - name: Restart ApplicationSet controller to load progressive syncs
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - restart
          - deployment/argocd-applicationset-controller
          - --namespace=argocd
      when: argocd_http_backend.changed
      changed_when: true

    - name: Wait for Argo CD server rollout
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - deployment/argocd-server
          - --namespace=argocd
          - --timeout=180s
      changed_when: false

    - name: Wait for ApplicationSet controller rollout
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - deployment/argocd-applicationset-controller
          - --namespace=argocd
          - --timeout=180s
      changed_when: false

    - name: Build and import the pinned LiteLLM Headroom image before Argo sync
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ home_repo_root }}/scripts/build-litellm-headroom.sh"
      register: litellm_headroom_image
      changed_when: "'Imported ' in litellm_headroom_image.stdout"

    - name: Build and import the pinned Agent Browser image before Argo sync
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ home_repo_root }}/scripts/build-agent-browser.sh"
      register: agent_browser_image
      changed_when: "'Imported ' in agent_browser_image.stdout"

    - name: Build and import the pinned multilingual Graphiti embedder before Argo sync
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ home_repo_root }}/scripts/build-graphiti-embedder.sh"
      register: graphiti_embedder_image
      changed_when: "'Imported ' in graphiti_embedder_image.stdout"

    - name: Apply the environment's root Application
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - -f
          - "{{ home_repo_root }}/clusters/{{ home_environment }}/root-app.yaml"
      register: root_application
      changed_when: "'created' in root_application.stdout or 'configured' in root_application.stdout"
