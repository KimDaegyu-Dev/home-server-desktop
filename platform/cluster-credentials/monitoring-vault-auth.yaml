apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-vault-auth
  namespace: monitoring
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: monitoring
  namespace: monitoring
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: monitoring-vso
    serviceAccount: monitoring-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
