apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-server-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
        revision: main
        requeueAfterSeconds: 60
        files:
          - path: clusters/wsl/apps/catalog/*.yaml
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{.metadata.name}}"
      labels:
        app.kubernetes.io/part-of: home-server-desktop
        home-server.io/stage: "{{.metadata.labels.stage}}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.spec.destination.namespace}}"
  templatePatch: |
    spec:
      source:
        repoURL: {{.spec.source.repoURL | toJson}}
        targetRevision: {{.spec.source.targetRevision | toJson}}
        {{ if eq .metadata.labels.sourceType "helm" }}
        chart: {{.spec.source.chart | toJson}}
        helm:
          {{ if hasKey .metadata.labels "oci" }}
          enableOCI: true
          {{ end }}
          releaseName: {{.spec.source.helm.releaseName | toJson}}
          {{ if hasKey .metadata.labels "skipCrds" }}
          {{ if eq .metadata.labels.skipCrds "true" }}
          skipCrds: true
          {{ end }}
          {{ end }}
          values: {{.spec.source.helm.values | toJson}}
        {{ else }}
        path: {{.spec.source.path | toJson}}
        {{ end }}
      {{ if eq .metadata.name "litellm" }}
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: litellm-dbcredentials
          namespace: litellm
          jsonPointers:
            - /data
      {{ end }}
      syncPolicy:
        automated:
          enabled: true
          selfHeal: true
          prune: true
        retry:
          limit: 8
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          {{ if eq .metadata.name "litellm" }}
          - RespectIgnoreDifferences=true
          {{ end }}
          {{ if eq .metadata.labels.serverSideApply "true" }}
          - ServerSideApply=true
          {{ end }}
