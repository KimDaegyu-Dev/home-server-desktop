apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-vault-auth
  namespace: authentik
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: authentik
  namespace: authentik
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: authentik-vso
    serviceAccount: authentik-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
