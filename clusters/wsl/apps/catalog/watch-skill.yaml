apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: watch-skill
  namespace: argocd
  labels:
    sourceType: git
    serverSideApply: "false"
    stage: 75-project-context
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/watch-skill
  destination:
    server: https://kubernetes.default.svc
    namespace: watch-skill
