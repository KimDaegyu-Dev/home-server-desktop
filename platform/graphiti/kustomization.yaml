apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - graphiti.yaml
configMapGenerator:
  - name: graphiti-embedder
    namespace: graphiti
    files:
      - embedder_server.py
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: graphiti-config
    namespace: graphiti
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
