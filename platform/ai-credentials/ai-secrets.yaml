apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-vault-auth
  namespace: langfuse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-vault-auth
  namespace: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-vault-auth
  namespace: search
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-vault-auth
  namespace: mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-grafana-vault-auth
  namespace: mcp
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ai
  namespace: langfuse
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: langfuse-vso
    serviceAccount: ai-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ai
  namespace: litellm
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: litellm-vso
    serviceAccount: ai-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: search
  namespace: search
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: searxng-vso
    serviceAccount: search-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mcp
  namespace: mcp
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mcpproxy-vso
    serviceAccount: mcp-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mcp-grafana
  namespace: mcp
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mcp-grafana-vso
    serviceAccount: mcp-grafana-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-sso
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse-auth
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse-auth
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm
  namespace: litellm
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: litellm
  mount: kv
  path: ai/litellm
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: litellm-secrets
    overwrite: true
    transformation:
      templates:
        postgres-password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm-dbcredentials
  namespace: litellm
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: litellm
  mount: kv
  path: ai/litellm
  type: kv-v2
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    name: litellm-dbcredentials
    overwrite: true
    transformation:
      excludes:
        - .*
      templates:
        username:
          text: '{{- get .Secrets "POSTGRES_USER" -}}'
        password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
        postgres-password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: searxng-credentials
  namespace: search
spec:
  vaultAuthRef: search
  rolloutRestartTargets:
    - kind: Deployment
      name: searxng
  mount: kv
  path: mcp/searxng
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: searxng-credentials
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mcpproxy-credentials
  namespace: mcp
spec:
  vaultAuthRef: mcp
  rolloutRestartTargets:
    - kind: Deployment
      name: mcpproxy
  mount: kv
  path: mcp/mcpproxy
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: mcpproxy-credentials
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-mcp-credentials
  namespace: mcp
spec:
  vaultAuthRef: mcp-grafana
  rolloutRestartTargets:
    - kind: Deployment
      name: mcpproxy
  mount: kv
  path: monitoring/grafana-mcp
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: grafana-mcp-credentials
    overwrite: true
    transformation:
      excludes:
        - .*
      templates:
        mcp_server_token:
          text: '{{- get .Secrets "mcp_server_token" -}}'
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-exporter
  namespace: monitoring
spec:
  vaultAuthRef: monitoring
  rolloutRestartTargets:
    - kind: Deployment
      name: alloy
  mount: kv
  path: ai/langfuse-exporter
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse-exporter
    overwrite: true
    transformation:
