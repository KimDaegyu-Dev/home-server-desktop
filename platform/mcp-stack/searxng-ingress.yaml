apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng
  namespace: search
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - searxng
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port:
                  number: 8080
