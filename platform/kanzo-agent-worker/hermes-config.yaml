model:
  provider: openai-api
  default: iq_3s
  context_length: 65536
  base_url: ${LITELLM_BASE_URL}
  api_key: ${LITELLM_API_KEY}

terminal:
  backend: local

toolsets:
  - hermes-cli

agent:
  max_turns: 40
  reasoning_effort: xhigh
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - computer_use

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  review_dispatch: true

web:
  search_backend: searxng

mcp_servers:
  home_server:
    url: ${MCPPROXY_URL}
    headers:
      X-API-Key: ${MCPPROXY_AGENT_READ_TOKEN}
