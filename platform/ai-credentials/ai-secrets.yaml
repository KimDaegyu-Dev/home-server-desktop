---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm
  namespace: litellm
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: litellm
  mount: kv
  path: ai/litellm
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: litellm-secrets
    overwrite: true
    transformation:
      templates:
        postgres-password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm-dbcredentials
  namespace: litellm
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: litellm
  mount: kv
  path: ai/litellm
  type: kv-v2
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    name: litellm-dbcredentials
    overwrite: true
    transformation:
      excludes:
        - .*
      templates:
        username:
          text: '{{- get .Secrets "POSTGRES_USER" -}}'
        password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
        postgres-password:
          text: '{{- get .Secrets "POSTGRES_PASSWORD" -}}'
---
