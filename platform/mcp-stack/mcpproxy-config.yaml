apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpproxy-config
  namespace: mcp
data:
  mcp_config.json: |
    {
      "listen": "0.0.0.0:8080",
      "data_dir": "/data",
      "trusted_proxies": ["10.42.0.0/16"],
      "trusted_hosts": ["mcp.tail5389e9.ts.net"],
      "require_mcp_auth": true,
      "mcp_reject_query_apikey": true,
      "enable_socket": false,
      "health_check_interval": "60s",
      "tool_discovery_interval": "5m",
      "call_tool_timeout": "5m",
      "audit_log": {
        "enabled": true,
        "stdout": true
      },
      "telemetry": {
        "enabled": false
      },
      "features": {
        "enable_web_ui": true
      },
      "update_check": {
        "enabled": false
      },
      "observability": {
        "metrics": {
          "enabled": true
        },
        "tracing": {
          "enabled": true,
          "protocol": "grpc",
          "endpoint": "alloy.monitoring.svc.cluster.local:4317",
          "sample_rate": 1.0
        }
      },
      "server_edition": {
        "enabled": true,
        "admin_emails": ["ddk3207@naver.com"],
        "public_url": "https://mcp.tail5389e9.ts.net",
        "session_cookie_secure": "auto",
        "credential_encryption_key": "${env:MCPPROXY_CRED_KEY}",
        "oauth": {
          "provider": "oidc",
          "issuer_url": "https://authentik.tail5389e9.ts.net/application/o/mcp-proxy/",
          "client_id": "mcp-proxy",
          "client_secret": "${env:OIDC_CLIENT_SECRET}",
          "scopes": ["openid", "profile", "email"],
          "email_verified_policy": "ignore",
          "display_name": "Authentik"
        }
      },
      "mcpServers": [
        {
          "name": "context7",
          "url": "https://mcp.context7.com/mcp",
          "protocol": "http",
          "enabled": true
        },
        {
          "name": "grafana",
          "url": "http://grafana-mcp.grafana-mcp.svc.cluster.local:8000/mcp",
          "protocol": "http",
          "headers": {
            "Authorization": "Bearer ${env:GRAFANA_MCP_SERVER_TOKEN}"
          },
          "enabled": true
        },
        {
          "name": "ai-memory",
          "url": "http://ai-memory.ai-memory.svc.cluster.local:49374/mcp",
          "protocol": "http",
          "headers": {
            "Authorization": "Bearer ${env:AI_MEMORY_AUTH_TOKEN}"
          },
          "enabled": true
        },
        {
          "name": "graphify",
          "url": "http://graphify.graphify.svc.cluster.local:8080/mcp",
          "protocol": "http",
          "enabled": true
        },
        {
          "name": "kanzo",
          "url": "http://kanzo:4242/mcp",
          "protocol": "http",
          "enabled": true
        },
        {
          "name": "watchskill",
          "url": "http://watch-skill.watch-skill.svc.cluster.local:8748/mcp",
          "protocol": "http",
          "headers": {
            "Authorization": "Bearer ${env:WATCHSKILL_MCP_TOKEN}"
          },
          "enabled": true
        },
        {
          "name": "graphiti",
          "url": "http://graphiti.graphiti.svc.cluster.local:8000/mcp",
          "protocol": "http",
          "enabled": true
        },
        {
          "name": "agentbrowser",
          "url": "http://agent-browser.agent-browser.svc.cluster.local:8080/mcp",
          "protocol": "http",
          "headers": {
            "Authorization": "Bearer ${env:AGENT_BROWSER_MCP_TOKEN}"
          },
          "enabled": true
        },
        {
          "name": "searxng",
          "url": "http://searxng-mcp.mcp.svc.cluster.local:8090/mcp",
          "protocol": "http",
          "enabled": true
        }
      ]
    }
