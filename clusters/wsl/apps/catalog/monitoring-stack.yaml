apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    sourceType: helm
    serverSideApply: "true"
    stage: 50-monitoring-stack
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: ghcr.io/prometheus-community/charts
    chart: kube-prometheus-stack
    targetRevision: "93.1.0"
    helm:
      releaseName: monitoring
      values: |
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi
          service:
            type: ClusterIP
          ingress:
            enabled: false
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client_secret
          grafana.ini:
            server:
              root_url: https://grafana.tail5389e9.ts.net
            auth:
              disable_login_form: false
              generic_oauth:
                enabled: true
                name: Authentik
                allow_sign_up: true
                client_id: grafana
                client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
                scopes: openid profile email offline_access
                auth_url: https://authentik.tail5389e9.ts.net/application/o/authorize/
                token_url: https://authentik.tail5389e9.ts.net/application/o/token/
                api_url: https://authentik.tail5389e9.ts.net/application/o/userinfo/
                use_pkce: true
                use_refresh_token: true
                auto_login: false
                role_attribute_path: "'Editor'"
        prometheus:
          enabled: true
          prometheusSpec:
            retention: 30d
            retentionSize: 18GB
            enableRemoteWriteReceiver: true
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
        kubeEtcd:
          enabled: false
        prometheus-node-exporter:
          hostRootFsMount:
            mountPropagation: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
