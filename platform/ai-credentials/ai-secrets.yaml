apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-vault-auth
  namespace: langfuse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-vault-auth
  namespace: litellm
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ai
  namespace: langfuse
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: langfuse-vso
    serviceAccount: ai-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ai
  namespace: litellm
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: litellm-vso
    serviceAccount: ai-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-sso
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse-auth
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse-auth
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm
  namespace: litellm
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: litellm
  mount: kv
  path: ai/litellm
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: litellm-secrets
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-exporter
  namespace: monitoring
spec:
  vaultAuthRef: monitoring
  rolloutRestartTargets:
    - kind: Deployment
      name: alloy
  mount: kv
  path: ai/langfuse-exporter
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse-exporter
    overwrite: true
    transformation:
