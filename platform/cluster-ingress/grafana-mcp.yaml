apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-mcp
  namespace: grafana-mcp
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - grafana-mcp
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-mcp
                port:
                  number: 8000
