apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: "0.34.1"
    helm:
      releaseName: vault
      values: |
        global:
          tlsDisable: true
        injector:
          enabled: false
        server:
          image:
            repository: hashicorp/vault
            tag: "2.2.1"
            pullPolicy: IfNotPresent
          authDelegator:
            enabled: true
          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: local-path
          readinessProbe:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
          ha:
            enabled: true
            replicas: 1
            raft:
              enabled: true
              setNodeId: false
              config: |
                ui = true
                disable_mlock = true
                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }
                storage "raft" {
                  path = "/vault/data"
                  node_id = "home-server-wsl-vault"
                }
                service_registration "kubernetes" {}
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
