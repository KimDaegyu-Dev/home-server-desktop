apiVersion: v1
kind: ConfigMap
metadata:
  name: kanzo-sandbox-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kanzo-sandbox.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le, kind) (rate(kanzo_worker_sandbox_cpu_seconds_bucket[$__rate_interval])))", "legendFormat": "p50 {{kind}}", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le, kind) (rate(kanzo_worker_sandbox_cpu_seconds_bucket[$__rate_interval])))", "legendFormat": "p95 {{kind}}", "refId": "B"}
          ],
          "title": "Sandbox cumulative CPU per run",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le, kind, source) (rate(kanzo_worker_sandbox_memory_peak_bytes_bucket[$__rate_interval])))", "legendFormat": "p50 {{kind}} / {{source}}", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le, kind, source) (rate(kanzo_worker_sandbox_memory_peak_bytes_bucket[$__rate_interval])))", "legendFormat": "p95 {{kind}} / {{source}}", "refId": "B"}
          ],
          "title": "Sandbox memory high-water mark per run",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "value"},
          "targets": [{"expr": "sum(increase(kanzo_worker_sandbox_cpu_seconds_count[$__range]))", "refId": "A"}],
          "title": "Measured sandbox runs in selected range",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (kind) (increase(kanzo_worker_sandbox_memory_peak_bytes_count[$__range]))", "legendFormat": "{{kind}}", "refId": "A"}],
          "title": "Runs with recorded memory high-water mark",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["kanzo", "hermes", "sandbox"],
      "time": {"from": "now-24h", "to": "now"},
      "title": "Kanzo Sandbox Resources",
      "uid": "kanzo-sandbox-resources",
      "version": 1
    }
