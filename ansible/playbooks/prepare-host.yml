---
- name: Prepare the Linux host for K3s
  hosts: home_server
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu or Debian with systemd
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - ansible_facts.service_mgr == "systemd"
        fail_msg: "This bootstrap supports Ubuntu/Debian with systemd."

    - name: Install host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - iptables
          - git
          - buildah
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Persist a 1500-byte WSL virtual NIC MTU before K3s starts
      when: home_environment == "wsl"
      block:
        - name: Install the WSL network MTU systemd unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/home-server-wsl-mtu.service
            owner: root
            group: root
            mode: "0644"
            content: |
              [Unit]
              Description=Set WSL2 virtual NIC MTU for Kubernetes Tailscale ingress
              Wants=network-online.target
              After=network-online.target
              Before=k3s.service

              [Service]
              Type=oneshot
              ExecStart=/usr/sbin/ip link set dev eth0 mtu 1500
              RemainAfterExit=yes

              [Install]
              WantedBy=multi-user.target
          register: wsl_mtu_unit

        - name: Enable and apply the WSL network MTU unit
          ansible.builtin.systemd_service:
            name: home-server-wsl-mtu.service
            enabled: true
            state: started
            daemon_reload: true

    - name: Create the K3s local persistent-volume directory
      ansible.builtin.file:
        path: "{{ k3s_storage_path }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install the WSL Strata bridge endpoint refresh timer
      when: home_environment == "wsl"
      block:
        - name: Install the endpoint updater script
          ansible.builtin.copy:
            src: ../../scripts/update-strata-bridge-endpoint.sh
            dest: /usr/local/sbin/home-server-update-strata-bridge-endpoint.sh
            owner: root
            group: root
            mode: "0755"

        - name: Install the systemd endpoint service
          ansible.builtin.template:
            src: ../templates/strata-bridge-endpoint.service.j2
            dest: /etc/systemd/system/home-server-strata-bridge-endpoint.service
            owner: root
            group: root
            mode: "0644"

        - name: Install the systemd endpoint timer
          ansible.builtin.template:
            src: ../templates/strata-bridge-endpoint.timer.j2
            dest: /etc/systemd/system/home-server-strata-bridge-endpoint.timer
            owner: root
            group: root
            mode: "0644"

        - name: Enable the endpoint refresh timer
          ansible.builtin.systemd_service:
            name: home-server-strata-bridge-endpoint.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: Show selected profile
      ansible.builtin.debug:
        msg: "Profile={{ home_environment }}, storage={{ k3s_storage_path }}"
