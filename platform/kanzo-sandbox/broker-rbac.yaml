apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanzo-sandbox-broker
  namespace: mcp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanzo-sandbox-pod-manager
  namespace: kanzo-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanzo-sandbox-broker
  namespace: kanzo-sandboxes
subjects:
  - kind: ServiceAccount
    name: kanzo-sandbox-broker
    namespace: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kanzo-sandbox-pod-manager
