apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-credentials
  namespace: argocd
  labels:
    sourceType: git
    serverSideApply: "false"
    stage: 00-credentials
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/cluster-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
