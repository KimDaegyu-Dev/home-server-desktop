apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  vaultAuthRef: tailscale-operator
  mount: kv
  path: tailscale/operator
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: operator-oauth
    overwrite: true
    transformation:
      excludeRaw: true
