apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse
    overwrite: true
    transformation:
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-sso
  namespace: langfuse
spec:
  vaultAuthRef: ai
  rolloutRestartTargets:
    - kind: Deployment
      name: langfuse-web
    - kind: Deployment
      name: langfuse-worker
  mount: kv
  path: ai/langfuse-auth
  type: kv-v2
