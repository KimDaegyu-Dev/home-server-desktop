server {
    listen 8080;
    server_name _;

    # Tailscale terminates HTTPS before forwarding to this pod. Validate the
    # original public Host and browser Origin, then normalize them for Kanzo's
    # HTTP-only same-origin and DNS-rebinding guard.
    if ($http_host !~* ^(kanzo\.tail5389e9\.ts\.net|kanzo-web\.kanzo\.svc\.cluster\.local:8080)$) {
        return 421;
    }
    if ($http_origin !~* ^(https://kanzo\.tail5389e9\.ts\.net)?$) {
        return 403;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Internal cluster consumers use the task-free SSE endpoint directly.
    location = /api/events {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4242;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:4242;
        proxy_set_header Origin http://localhost:4242;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
