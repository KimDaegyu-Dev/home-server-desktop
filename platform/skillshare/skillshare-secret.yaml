apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: skillshare-credentials
  namespace: mcp
spec:
  vaultAuthRef: mcp
  rolloutRestartTargets:
    - kind: Deployment
      name: skillshare
    - kind: Deployment
      name: mcpproxy
  mount: kv
  path: mcp/skillshare
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: skillshare-credentials
    overwrite: true
