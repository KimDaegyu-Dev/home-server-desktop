apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - worker.yaml
  - executor.yaml
  - dispatcher.yaml
  - grafana-dashboard.yaml
  - dispatcher-state.yaml
  - dispatcher-state-binder.yaml
  - state-migration-job.yaml
  - hermes-dashboard-ingress.yaml
configMapGenerator:
  - name: kanzo-agent-hermes-config
    namespace: mcp
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    files:
      - config.yaml=hermes-config.yaml
  - name: kanzo-agent-worker-code
    namespace: mcp
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
        argocd.argoproj.io/sync-options: ServerSideApply=true
    files:
      - worker.py=worker.py
      - run_ledger.py=run_ledger.py
      - artifact_store.py=artifact_store.py
      - event_adapter.py=event_adapter.py
      - readonly_executor.py=readonly_executor.py
      - gateway_control.py=gateway_control.py
      - gateway_session.py=gateway_session.py
      - gateway_execution.py=gateway_execution.py
      - executor_api.py=executor_api.py
      - runtime_lock.py=runtime_lock.py
      - executor_client.py=executor_client.py
      - migrate_dispatcher_state.py=migrate_dispatcher_state.py
      - broker_client.py=broker_client.py
      - langfuse_reconcile.py=langfuse_reconcile.py
      - workspace_transfer.py=workspace_transfer.py
      - kanzo_terminal_provider.py=kanzo_terminal_provider.py
      - langfuse_session_context.py=langfuse_session_context.py
      - sync_hermes_env.py=sync_hermes_env.py
      - reconcile_hermes_pm.py=reconcile_hermes_pm.py
      - configure_kanban_toolsearch.py=configure_kanban_toolsearch.py
  - name: kanzo-agent-omh-routing
    namespace: mcp
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    files:
      - model-chains.json=model-chains.json
  - name: kanzo-human-agent-report-skill
    namespace: mcp
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    files:
      - skill.md=skills/human-agent-report/SKILL.md
      - readme.md=skills/human-agent-report/README.md
      - report-lint.py=skills/human-agent-report/scripts/report_lint.py
      - fact-contract.md=skills/human-agent-report/references/fact-contract.md
      - report-template.md=skills/human-agent-report/templates/report-template.md
      - example-report.md=skills/human-agent-report/examples/report.md
      - example-facts.json=skills/human-agent-report/examples/facts.json
      - test-report-lint.py=skills/human-agent-report/tests/test_report_lint.py
