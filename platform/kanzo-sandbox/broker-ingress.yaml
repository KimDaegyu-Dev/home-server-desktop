apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanzo-sandbox-broker
  namespace: mcp
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - kanzo-broker
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanzo-sandbox-broker
                port:
                  number: 8080
