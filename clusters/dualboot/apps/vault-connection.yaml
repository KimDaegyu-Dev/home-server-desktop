apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-connection
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/vault-connection
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
