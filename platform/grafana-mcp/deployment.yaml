apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-grafana
          image: grafana/mcp-grafana:2.1.1
          args:
            - -t
            - streamable-http
            - --enabled-tools=search,datasource,prometheus,dashboard,folder
            - --allowed-hosts=grafana-mcp.tail5389e9.ts.net
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GRAFANA_URL
              value: http://monitoring-grafana.monitoring.svc:80
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-credentials
                  key: grafana_service_account_token
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-credentials
                  key: mcp_server_token
            - name: GRAFANA_USAGE_STATS
              value: disabled
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: grafana-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
