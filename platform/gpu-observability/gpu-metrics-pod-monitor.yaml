apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: wsl-gpu-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: gpu-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: monitoring
      app.kubernetes.io/name: prometheus-node-exporter
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
      metricRelabelings:
        - action: keep
          sourceLabels:
            - __name__
          regex: wsl_gpu_.*
