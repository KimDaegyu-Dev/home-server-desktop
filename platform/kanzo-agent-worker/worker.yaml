apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanzo-agent-hermes-home
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanzo-agent-worker
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanzo-agent-vault-auth
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kanzo-agent
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kanzo-agent-vso
    serviceAccount: kanzo-agent-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kanzo-agent-credentials
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  vaultAuthRef: kanzo-agent
  rolloutRestartTargets:
  - kind: Deployment
    name: kanzo-agent-worker
  mount: kv
  path: mcp/kanzo-agent
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: kanzo-agent-credentials
    overwrite: true
    transformation:
      excludes:
      - .*
      templates:
        MCPPROXY_KANZO_AGENT_TOKEN:
          text: '{{- get .Secrets "MCPPROXY_KANZO_AGENT_TOKEN" -}}'
        MCPPROXY_AGENT_READ_TOKEN:
          text: '{{- get .Secrets "MCPPROXY_AGENT_READ_TOKEN" -}}'
        LITELLM_API_KEY:
          text: '{{- get .Secrets "LITELLM_API_KEY" -}}'
        GITHUB_TOKEN:
          text: '{{- get .Secrets "GITHUB_TOKEN" -}}'
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME:
          text: '{{- get .Secrets "HERMES_DASHBOARD_BASIC_AUTH_USERNAME" -}}'
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
          text: '{{- get .Secrets "HERMES_DASHBOARD_BASIC_AUTH_PASSWORD" -}}'
        HERMES_DASHBOARD_BASIC_AUTH_SECRET:
          text: '{{- get .Secrets "HERMES_DASHBOARD_BASIC_AUTH_SECRET" -}}'
        KANZO_EXECUTOR_API_TOKEN:
          text: '{{- get .Secrets "KANZO_EXECUTOR_API_TOKEN" -}}'
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes-langfuse-credentials
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  vaultAuthRef: kanzo-agent
  rolloutRestartTargets:
  - kind: Deployment
    name: kanzo-agent-worker
  mount: kv
  path: mcp/kanzo-agent
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: hermes-langfuse-credentials
    overwrite: true
    transformation:
      excludes:
      - .*
      templates:
        HERMES_LANGFUSE_PUBLIC_KEY:
          text: '{{- get .Secrets "LANGFUSE_PUBLIC_KEY" -}}'
        HERMES_LANGFUSE_SECRET_KEY:
          text: '{{- get .Secrets "LANGFUSE_SECRET_KEY" -}}'
      excludeRaw: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanzo-agent-worker
  namespace: mcp
  labels:
    app.kubernetes.io/name: kanzo-agent-worker
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kanzo-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanzo-agent-worker
    spec:
      serviceAccountName: kanzo-agent-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed-hermes-config
        image: busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
        command:
        - /bin/sh
        - -ec
        args:
        - "mkdir -p /data/home\nif [ ! -f /data/home/config.yaml ]; then\n  cp /config/config.yaml /data/home/config.yaml\n\
          \  chmod 0600 /data/home/config.yaml\nfi\nchmod 0700 /data/home\n"
        volumeMounts:
        - name: hermes-home
          mountPath: /data
        - name: hermes-config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities:
            drop:
            - ALL
      - name: bootstrap-omh
        image: localhost/home-server/kanzo-agent-worker:0.2.1-hermes-v0.23.1-omh-4.0.7-pnpmfix1
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -ec
        args:
        - "export HERMES_HOME=/opt/data/home HOME=/opt/data/home\npython - <<'PY'\nimport json\nimport shutil\nfrom pathlib\
          \ import Path\n\nimage_store = Path('/opt/hermes/tools')\nhome_store = Path('/opt/data/home/tools')\nimage_facts\
          \ = json.loads((image_store / 'facts.json').read_text(encoding='utf-8'))\npnpm = image_facts.get('packages', {}).get('pnpm')\n\
          if not pnpm:\n    raise SystemExit('image is missing the pinned pnpm package metadata')\nhome_store.mkdir(parents=True,\
          \ exist_ok=True)\nentry = pnpm['entry']\nshutil.copytree(image_store / entry, home_store / entry, dirs_exist_ok=True)\n\
          facts_path = home_store / 'facts.json'\nhome_facts = json.loads(facts_path.read_text(encoding='utf-8')) if facts_path.exists()\
          \ else {'packages': {}, 'schema': image_facts.get('schema')}\nhome_facts.setdefault('packages', {})['pnpm'] = pnpm\n\
          facts_path.write_text(json.dumps(home_facts, sort_keys=True, indent=2) + '\\n', encoding='utf-8')\nPY\n/opt/hermes/.venv/bin/python\
          \ -c 'from pm.install import installed_package; assert installed_package(\"pnpm\") is not None'\nhermes kanban init\n\
          hermes config set kanban.dispatch_in_gateway true\nhermes config set kanban.dispatch_interval_seconds 60\nhermes\
          \ config set kanban.review_dispatch true\nhermes profile list | grep -Eq '(^|[[:space:]])researcher([[:space:]]|$)'\
          \ || \\\n  hermes profile create researcher --clone-from default --description \"Analyzes source code, official\
          \ docs, and external information; returns evidence-linked findings.\" --no-alias\nhermes profile list | grep -Eq\
          \ '(^|[[:space:]])builder([[:space:]]|$)' || \\\n  hermes profile create builder --clone-from default --description\
          \ \"Implements scoped changes using the local coder model and returns changed files plus verification evidence.\"\
          \ --no-alias\nhermes profile list | grep -Eq '(^|[[:space:]])reviewer([[:space:]]|$)' || \\\n  hermes profile create\
          \ reviewer --clone-from default --description \"Reviews proposed work for correctness, regressions, and missing\
          \ evidence; reports findings without owning implementation.\" --no-alias\nhermes -p researcher config set model.provider\
          \ openai-api\nhermes -p researcher config set model.default iq_3s\nhermes -p builder config set model.provider openai-api\n\
          hermes -p builder config set model.default coder\nhermes -p reviewer config set model.provider openai-api\nhermes\
          \ -p reviewer config set model.default iq_3s\nhermes tools enable kanban\nhermes -p researcher tools enable kanban\n\
          hermes -p builder tools enable kanban\nhermes -p reviewer tools enable kanban\nhermes config set model.provider\
          \ openai-api\nhermes config set model.default iq_3s\nhermes config set model.context_length 65536\nhermes -p researcher\
          \ config set model.context_length 65536\nhermes -p reviewer config set model.context_length 65536\npython - <<'PY'\n\
          from pathlib import Path\nfrom ruamel.yaml import YAML\n\nhomes = [Path('/opt/data/home'), *(Path('/opt/data/home/profiles')\
          \ / name for name in ('researcher', 'builder', 'reviewer'))]\nyaml = YAML()\nfor home in homes:\n    config_path\
          \ = home / 'config.yaml'\n    config = yaml.load(config_path.read_text(encoding='utf-8')) or {}\n    terminal =\
          \ config.setdefault('terminal', {})\n    if not isinstance(terminal, dict):\n        raise SystemExit(f'{config_path}\
          \ has an invalid terminal configuration')\n    names = terminal.get('client_env_passthrough', [])\n    if not isinstance(names,\
          \ list) or any(not isinstance(name, str) for name in names):\n        raise SystemExit(f'{config_path} has an invalid\
          \ client_env_passthrough list')\n    for name in ('KANZO_AUTOMATED_RUN', 'KANZO_TASK_ID', 'KANZO_RUN_ID'):\n   \
          \     if name not in names:\n            names.append(name)\n    terminal['client_env_passthrough'] = names\n  \
          \  with config_path.open('w', encoding='utf-8') as stream:\n        yaml.dump(config, stream)\nPY\npython - <<'PY'\n\
          import shutil\nfrom pathlib import Path\n\nsource = Path('/opt/kanzo-agent/kanzo_terminal_provider.py')\nif not\
          \ source.is_file():\n    raise SystemExit('Kanzo terminal provider module is missing')\nhomes = [Path('/opt/data/home'),\
          \ *(Path('/opt/data/home/profiles') / name for name in ('researcher', 'builder', 'reviewer'))]\nfor home in homes:\n\
          \    plugin = home / 'plugins' / 'kanzo_broker'\n    plugin.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(source,\
          \ plugin / '__init__.py')\n    (plugin / 'plugin.yaml').write_text(\n        'name: kanzo_broker\\\\nversion: 0.1.0\\\
          \\ndescription: Per-run Kanzo Kubernetes terminal backend\\\\nkind: backend\\\\n',\n        encoding='utf-8',\n\
          \    )\nPY\nhermes plugins enable kanzo_broker\nhermes config set plugins.isolation in_process\nhermes config set\
          \ terminal.backend kanzo_broker\nfor profile in researcher builder reviewer; do\n  hermes -p \"$profile\" plugins\
          \ enable kanzo_broker\n  hermes -p \"$profile\" config set plugins.isolation in_process\n  hermes -p \"$profile\"\
          \ config set terminal.backend kanzo_broker\ndone\npython - <<'PY'\nimport os\nfrom pathlib import Path\n\nroot =\
          \ Path('/opt/data/home')\nvalues = {\n    'MCPPROXY_URL': os.environ['MCPPROXY_URL'],\n    'MCPPROXY_AGENT_READ_TOKEN':\
          \ os.environ.get('MCPPROXY_AGENT_READ_TOKEN', ''),\n    'LITELLM_API_KEY': os.environ.get('LITELLM_API_KEY', ''),\n\
          \    'LITELLM_BASE_URL': os.environ['LITELLM_BASE_URL'],\n    'OPENAI_API_KEY': os.environ.get('LITELLM_API_KEY',\
          \ ''),\n    'OPENAI_BASE_URL': os.environ['LITELLM_BASE_URL'],\n    'KANZO_ANALYSIS_MODEL': 'iq_3s',\n}\nhomes =\
          \ [root, *(root / 'profiles' / name for name in ('researcher', 'builder', 'reviewer'))]\nfor home in homes:\n  \
          \  path = home / '.env'\n    existing = path.read_text(encoding='utf-8').splitlines() if path.exists() else []\n\
          \    kept = [line for line in existing if line.partition('=')[0] not in values]\n    path.write_text('\\n'.join([*kept,\
          \ *(f'{key}={value}' for key, value in values.items())]) + '\\n', encoding='utf-8')\n    path.chmod(0o600)\nPY\n\
          omh setup --no-interactive --json\nmkdir -p /opt/data/home/.omh/routing\ncp /routing/model-chains.json /opt/data/home/.omh/routing/model-chains.json\n\
          omh model-chains show --json\nomh doctor --json\n"
        env:
        - name: MCPPROXY_URL
          value: http://mcpproxy.mcp.svc.cluster.local:8080/mcp
        - name: MCPPROXY_AGENT_READ_TOKEN
          valueFrom:
            secretKeyRef:
              name: kanzo-agent-credentials
              key: MCPPROXY_AGENT_READ_TOKEN
              optional: true
        - name: LITELLM_BASE_URL
          value: http://litellm.litellm.svc.cluster.local:4000/v1
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: kanzo-agent-credentials
              key: LITELLM_API_KEY
              optional: true
        volumeMounts:
        - name: hermes-home
          mountPath: /opt/data
        - name: worker-code
          mountPath: /opt/kanzo-agent/kanzo_terminal_provider.py
          subPath: kanzo_terminal_provider.py
          readOnly: true
        - name: omh-routing
          mountPath: /routing
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          capabilities:
            drop:
            - ALL
      containers:
      - name: worker
        image: localhost/home-server/kanzo-agent-worker:0.2.1-hermes-v0.23.1-omh-4.0.7-pnpmfix1
        imagePullPolicy: Never
        ports:
        - name: metrics
          containerPort: 9105
          protocol: TCP
        env:
        - name: HERMES_HOME
          value: /opt/data/home
        - name: HOME
          value: /opt/data/home
        - name: KANZO_WORKSPACE
          value: /workspace
        - name: MCPPROXY_URL
          value: http://mcpproxy.mcp.svc.cluster.local:8080/mcp
        - name: LITELLM_BASE_URL
          value: http://litellm.litellm.svc.cluster.local:4000/v1
        - name: SEARXNG_URL
          value: http://searxng.search.svc.cluster.local:8080
        - name: KANZO_HEARTBEAT_STALE_SECONDS
          value: '900'
        - name: KANZO_ENABLED
          value: 'true'
        - name: KANZO_CATALOG_PROJECT
          value: kanzo-project-catalog
        - name: KANZO_CODE_PROVIDER
          value: openai-api
        - name: KANZO_CODE_MODEL
          value: coder
        - name: KANZO_ANALYSIS_PROVIDER
