apiVersion: v1
kind: ResourceQuota
metadata:
  name: kanzo-sandbox-quota
  namespace: kanzo-sandboxes
spec:
  hard:
    pods: "8"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.ephemeral-storage: 32Gi
    limits.ephemeral-storage: 48Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kanzo-sandbox-limits
  namespace: kanzo-sandboxes
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      max:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 12Gi
