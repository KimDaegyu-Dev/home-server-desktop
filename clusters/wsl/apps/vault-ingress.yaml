apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/vault-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
