apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - worker.yaml
configMapGenerator:
  - name: kanzo-agent-hermes-config
    namespace: mcp
    files:
      - config.yaml=hermes-config.yaml
  - name: kanzo-agent-worker-code
    namespace: mcp
    files:
      - worker.py=worker.py
