apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphify-data
  namespace: graphify
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphify
  namespace: graphify
  labels:
    app.kubernetes.io/name: graphify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: graphify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphify
      annotations:
        graphify.io/source-revision: "7d3a92a3ad8fc2a2f6a258f1918d6ae16f31241d"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: build-index
          image: python:3.13-slim@sha256:48d884813cf44e927cf64c5529dd630dd3b18338c6dc727991eef9b71e934a20
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes
              --target /opt/graphify/site -r /opt/graphify/requirements.lock;
              exec python3 /opt/graphify/graphify-build.py
          env:
            - name: GRAPHIFY_SOURCE_REVISION
              value: 7d3a92a3ad8fc2a2f6a258f1918d6ae16f31241d
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: python-packages
              mountPath: /opt/graphify
            - name: graphify-builder
              mountPath: /opt/graphify/graphify-build.py
              subPath: graphify-build.py
              readOnly: true
            - name: graphify-builder
              mountPath: /opt/graphify/requirements.lock
              subPath: requirements.lock
              readOnly: true
            - name: work
              mountPath: /work
            - name: graph-data
              mountPath: /graph
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: graphify-mcp
          image: python:3.13-slim@sha256:48d884813cf44e927cf64c5529dd630dd3b18338c6dc727991eef9b71e934a20
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - exec python3 -m graphify.serve /graph/graph.json --transport http --host 0.0.0.0 --port 8080 --stateless
          env:
            - name: PYTHONPATH
              value: /opt/graphify/site
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: python-packages
              mountPath: /opt/graphify
              readOnly: true
            - name: graph-data
              mountPath: /graph
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: python-packages
          emptyDir:
            sizeLimit: 1Gi
        - name: graphify-builder
          configMap:
            name: graphify-builder
            defaultMode: 0444
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: graph-data
          persistentVolumeClaim:
            claimName: graphify-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: graphify
  namespace: graphify
  labels:
    app.kubernetes.io/name: graphify
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: graphify
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graphify-mcp-ingress
  namespace: graphify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: graphify
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
      ports:
        - protocol: TCP
          port: 8080
