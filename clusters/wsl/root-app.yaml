apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-server-wsl
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: clusters/wsl/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
