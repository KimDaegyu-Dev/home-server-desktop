apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanzo-agent-workspaces
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: '-4'
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 32Gi
