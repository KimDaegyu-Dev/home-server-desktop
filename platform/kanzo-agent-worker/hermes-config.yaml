model:
  provider: openai-api
  default: ${KANZO_ANALYSIS_MODEL}
  base_url: ${LITELLM_BASE_URL}
  api_key: ${LITELLM_API_KEY}

terminal:
  backend: local

toolsets:
  - search
  - memory
  - skills
  - todo
  - terminal
  - file
  - delegation
  - code_execution
  - clarify
  - mcp-home_server

agent:
  max_turns: 40
  reasoning_effort: xhigh
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - computer_use

web:
  search_backend: searxng

mcp_servers:
  home_server:
    url: ${MCPPROXY_URL}
    headers:
      X-API-Key: ${MCPPROXY_AGENT_READ_TOKEN}
