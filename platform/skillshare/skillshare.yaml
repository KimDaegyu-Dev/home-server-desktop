apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skillshare-data
  namespace: skillshare
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillshare
  namespace: skillshare
  labels:
    app.kubernetes.io/name: skillshare
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skillshare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillshare
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-config
          image: ghcr.io/runkids/skillshare:0.26.4
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              mkdir -p /data/skills /data/agents;
              if [ ! -e /data/config.yaml ]; then cp /seed/config.yaml /data/config.yaml; fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: skillshare-data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: skillshare
          image: ghcr.io/runkids/skillshare:0.26.4
          imagePullPolicy: IfNotPresent
          command: [skillshare, mcp, serve, --http, 0.0.0.0:8765]
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: skillshare-data
              mountPath: /home/skillshare/.config/skillshare
      volumes:
        - name: skillshare-data
          persistentVolumeClaim:
            claimName: skillshare-data
        - name: seed
          configMap:
            name: skillshare-seed
---
apiVersion: v1
kind: Service
metadata:
  name: skillshare
  namespace: skillshare
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skillshare
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
