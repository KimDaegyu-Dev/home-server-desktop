apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - searxng-settings.yaml
  - searxng.yaml
  - kanzo-alias.yaml
  - mcpproxy-config.yaml
  - mcpproxy.yaml
  - mcpproxy-ingress.yaml
  - searxng-ingress.yaml
configMapGenerator:
  - name: searxng-mcp
    namespace: mcp
    files:
      - searxng-mcp.py
generatorOptions:
  disableNameSuffixHash: true
