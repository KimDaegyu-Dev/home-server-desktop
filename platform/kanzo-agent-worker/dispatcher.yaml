apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanzo-agent-dispatcher
  namespace: mcp
  labels:
    app.kubernetes.io/name: kanzo-agent-dispatcher
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kanzo-agent-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanzo-agent-dispatcher
    spec:
      serviceAccountName: kanzo-agent-worker
      automountServiceAccountToken: false
      # Hermes turns can run for 2700s; leave time for result publication and ledger finalization.
      terminationGracePeriodSeconds: 3300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: localhost/home-server/kanzo-agent-worker:0.2.1-hermes-v0.23.1-omh-4.0.7-pnpmfix2
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9105
              protocol: TCP
          env:
            - name: KANZO_WORKSPACE
              value: /workspace
            - name: MCPPROXY_URL
              value: http://mcpproxy.mcp.svc.cluster.local:8080/mcp
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: SEARXNG_URL
              value: http://searxng.search.svc.cluster.local:8080
            - name: KANZO_HEARTBEAT_STALE_SECONDS
              value: '900'
            - name: KANZO_ENABLED
              value: 'true'
            - name: KANZO_CATALOG_PROJECT
              value: kanzo-project-catalog
            - name: KANZO_CODE_PROVIDER
              value: openai-api
            - name: KANZO_CODE_MODEL
              value: coder
            - name: KANZO_ANALYSIS_PROVIDER
              value: openai-api
            - name: KANZO_ANALYSIS_MODEL
              value: iq_3s
            - name: KANZO_BROKER_URL
              value: http://kanzo-sandbox-broker.mcp.svc.cluster.local:8080
            - name: KANZO_EXECUTOR_API_URL
              value: http://kanzo-agent-executor.mcp.svc.cluster.local:8766
            - name: KANZO_EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanzo-agent-credentials
                  key: KANZO_EXECUTOR_API_TOKEN
                  optional: false
            - name: METRICS_PORT
              value: '9105'
            - name: MCPPROXY_KANZO_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanzo-agent-credentials
                  key: MCPPROXY_KANZO_AGENT_TOKEN
                  optional: true
            - name: KANZO_BROKER_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanzo-sandbox-broker-credentials
                  key: KANZO_BROKER_WORKER_TOKEN
                  optional: true
            - name: MCPPROXY_AGENT_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanzo-agent-credentials
                  key: MCPPROXY_AGENT_READ_TOKEN
                  optional: true
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kanzo-agent-credentials
                  key: LITELLM_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kanzo-agent-credentials
                  key: GITHUB_TOKEN
                  optional: true
            - name: HERMES_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-langfuse-credentials
                  key: HERMES_LANGFUSE_PUBLIC_KEY
            - name: HERMES_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-langfuse-credentials
                  key: HERMES_LANGFUSE_SECRET_KEY
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
            - name: HOME
              value: /tmp
            - name: KANZO_WORKER_STATE_DIR
              value: /opt/worker-state/state
          volumeMounts:
            - name: worker-code
              mountPath: /opt/kanzo-agent/worker.py
              subPath: worker.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/langfuse_reconcile.py
              subPath: langfuse_reconcile.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/run_ledger.py
              subPath: run_ledger.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/artifact_store.py
              subPath: artifact_store.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/executor_client.py
              subPath: executor_client.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/gateway_control.py
              subPath: gateway_control.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/gateway_session.py
              subPath: gateway_session.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/gateway_execution.py
              subPath: gateway_execution.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/broker_client.py
              subPath: broker_client.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/workspace_transfer.py
              subPath: workspace_transfer.py
              readOnly: true
            - name: worker-code
              mountPath: /opt/kanzo-agent/kanzo_terminal_provider.py
              subPath: kanzo_terminal_provider.py
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: dispatcher-state
              mountPath: /opt/worker-state
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: '2'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: kanzo-event-adapter
          image: localhost/home-server/kanzo-agent-worker:0.2.1-hermes-v0.23.1-omh-4.0.7-pnpmfix2
          imagePullPolicy: Never
          command:
            - python
            - /opt/kanzo-agent/event_adapter.py
          env:
            - name: KANZO_EVENTS_URL
              value: http://kanzo.kanzo.svc.cluster.local:4242/api/events
            - name: KANZO_WAKE_URL
              value: http://127.0.0.1:9105/wake
          volumeMounts:
            - name: worker-code
              mountPath: /opt/kanzo-agent/event_adapter.py
              subPath: event_adapter.py
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: worker-code
          configMap:
            name: kanzo-agent-worker-code
            defaultMode: 292
        - name: dispatcher-state
          persistentVolumeClaim:
            claimName: kanzo-agent-worker-state
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kanzo-agent-dispatcher-ingress
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kanzo-agent-dispatcher
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9105
