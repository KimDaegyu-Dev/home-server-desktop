---
- name: Retire the external systemd Vault after in-cluster verification
  hosts: home_server
  become: true
  gather_facts: false
  tasks:
    - name: Require the in-cluster Vault to be initialized and unsealed
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - exec
          - --namespace=vault
          - vault-0
          - --
          - vault
          - status
          - -format=json
      register: in_cluster_vault_status
      changed_when: false
      failed_when: >-
        in_cluster_vault_status.rc != 0 or
        not (in_cluster_vault_status.stdout | from_json).initialized or
        (in_cluster_vault_status.stdout | from_json).sealed

    - name: Require the OAuth secret to be synced and healthy by VSO
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - vaultstaticsecret
          - tailscale-operator-oauth
          - --namespace=tailscale
          - -o=jsonpath={.status.conditions[?(@.type=="SecretSynced")].status}{" "}{.status.conditions[?(@.type=="Healthy")].status}{" "}{.status.conditions[?(@.type=="Ready")].status}
      register: vso_secret_status
      changed_when: false
      failed_when: vso_secret_status.rc != 0 or vso_secret_status.stdout != "True True True"

    - name: Require the replacement Tailscale Vault Ingress to have an address
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - ingress
          - vault
          - --namespace=vault
          - -o=jsonpath={.status.loadBalancer.ingress[0].hostname}
      register: vault_ingress_address
      changed_when: false
      failed_when: vault_ingress_address.rc != 0 or vault_ingress_address.stdout | length == 0

    - name: Stop and disable the old systemd Vault service
      ansible.builtin.systemd_service:
        name: vault
        state: stopped
        enabled: false

    - name: Purge the old systemd Vault package
      ansible.builtin.apt:
        name: vault
        state: absent
        purge: true
        autoremove: false

    - name: Delete the old systemd Vault Raft data and host configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/vault
        - /etc/vault.d

    - name: Remove the old host-side Vault DNS alias
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^.*\svault\.home\.arpa$'
        state: absent

    - name: Check for the old CoreDNS Vault alias
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - configmap
          - coredns-custom
          - --namespace=kube-system
          - -o
          - jsonpath={.data.vault-home-arpa\.server}
      register: old_coredns_alias
      changed_when: false
      failed_when: false

    - name: Remove only the old Vault key from the shared CoreDNS ConfigMap
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - patch
          - configmap
          - coredns-custom
          - --namespace=kube-system
          - --type=json
          - -p
          - '[{"op":"remove","path":"/data/vault-home-arpa.server"}]'
      when: old_coredns_alias.stdout | length > 0

    - name: Restart CoreDNS after removing the host alias
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - restart
          - deployment/coredns
          - --namespace=kube-system
      when: old_coredns_alias.stdout | length > 0

    - name: Remove the old Vault Ingress bridge resources
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - delete
          - "{{ item.kind }}"
          - "{{ item.name }}"
          - --namespace=vault-access
          - --ignore-not-found=true
      loop:
        - { kind: ingress, name: vault }
        - { kind: deployment, name: vault-upstream-proxy }
        - { kind: service, name: vault-upstream-proxy }
        - { kind: secret, name: vault-ca }
      changed_when: "'deleted' in result.stdout"
      register: result

    - name: Remove the old Vault CA Secret used by VSO
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - delete
          - secret
          - vault-ca
          - --namespace=vault-secrets-operator-system
          - --ignore-not-found=true
      register: old_vso_ca
      changed_when: "'deleted' in old_vso_ca.stdout"

    - name: Remove the now-unused old ingress namespace
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - delete
          - namespace
          - vault-access
          - --ignore-not-found=true
      register: old_ingress_namespace
      changed_when: "'deleted' in old_ingress_namespace.stdout"

    - name: Report the protected migration materials that remain outside the host service
      ansible.builtin.debug:
        msg: >-
          The systemd Vault package, /var/lib/vault, /etc/vault.d, and old DNS/Ingress bridge
          have been removed. The Raft snapshot and original init file remain at their
          protected paths outside Git for recovery.
