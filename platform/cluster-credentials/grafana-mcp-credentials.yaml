apiVersion: v1
kind: Namespace
metadata:
  name: grafana-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-mcp-vault-auth
  namespace: grafana-mcp
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-mcp
  namespace: grafana-mcp
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-mcp-vso
    serviceAccount: grafana-mcp-vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-mcp-credentials
  namespace: grafana-mcp
spec:
  vaultAuthRef: grafana-mcp
  mount: kv
  path: monitoring/grafana-mcp
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: grafana-mcp-credentials
    overwrite: true
    transformation:
