apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress
  namespace: argocd
  labels:
    sourceType: git
    serverSideApply: "false"
    stage: 20-ingress
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/cluster-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
