apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcpproxy-data
  namespace: mcp
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpproxy
  namespace: mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcpproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcpproxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-data-ownership
          image: python:3.13-slim@sha256:48d884813cf44e927cf64c5529dd630dd3b18338c6dc727991eef9b71e934a20
          imagePullPolicy: IfNotPresent
          command: [chown, -R, 65532:65532, /data]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            readOnlyRootFilesystem: true
        - name: seed-config
          image: python:3.13-slim@sha256:48d884813cf44e927cf64c5529dd630dd3b18338c6dc727991eef9b71e934a20
          imagePullPolicy: IfNotPresent
          command: [python3, -c]
          args:
            - "from pathlib import Path; import shutil; target=Path('/data/mcp_config.json'); target.exists() or shutil.copyfile('/seed/mcp_config.json', target)"
          volumeMounts:
            - name: config-seed
              mountPath: /seed
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      containers:
        - name: mcpproxy
          image: localhost/home-server/mcpproxy-server:v0.73.0
          imagePullPolicy: Never
          args:
            - serve
            - --listen=0.0.0.0:8080
            - --config=/data/mcp_config.json
            - --data-dir=/data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCPPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcpproxy-credentials
                  key: MCPPROXY_API_KEY
            - name: MCPPROXY_CRED_KEY
              valueFrom:
                secretKeyRef:
                  name: mcpproxy-credentials
                  key: MCPPROXY_CRED_KEY
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcpproxy-credentials
                  key: authentik_client_secret
            - name: GRAFANA_MCP_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-credentials
                  key: mcp_server_token
            - name: AI_MEMORY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-memory-backend-credentials
                  key: AI_MEMORY_AUTH_TOKEN
            - name: WATCHSKILL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: watch-skill-backend-credentials
                  key: WATCHSKILL_MCP_TOKEN
            - name: AGENT_BROWSER_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-agent-browser-credentials
                  key: AGENT_BROWSER_MCP_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: config-seed
          configMap:
            name: mcpproxy-config
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: mcpproxy-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcpproxy
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcpproxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcpproxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcpproxy
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [mcp]
  selector:
    matchLabels:
      app.kubernetes.io/name: mcpproxy
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: mcpproxy-monitoring-credentials
          key: api_key
