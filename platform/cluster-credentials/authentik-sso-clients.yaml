apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-sso-clients
  namespace: authentik
spec:
  vaultAuthRef: authentik
  mount: kv
  path: authentik/sso-clients
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: authentik-sso-clients
    overwrite: true
    transformation:
      excludeRaw: true
