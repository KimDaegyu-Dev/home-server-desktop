apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-exporter
  namespace: monitoring
spec:
  vaultAuthRef: monitoring
  rolloutRestartTargets:
    - kind: Deployment
      name: alloy
  mount: kv
  path: ai/langfuse-exporter
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: langfuse-exporter
    overwrite: true
    transformation:
