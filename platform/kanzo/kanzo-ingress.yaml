apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanzo
  namespace: kanzo
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - kanzo
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanzo-web
                port:
                  number: 8080
