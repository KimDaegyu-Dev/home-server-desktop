apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-credentials
  namespace: argocd
  labels:
    sourceType: git
    serverSideApply: "false"
    stage: 73-ai-platform
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/ai-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
