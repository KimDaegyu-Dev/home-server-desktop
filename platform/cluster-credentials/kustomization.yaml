apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault-connection.yaml
  - auth-delegator.yaml
  - namespace.yaml
  - oauth-secret.yaml
  - vault-auth.yaml
  - authentik-namespace.yaml
  - config-secret.yaml
  - postgres-secret.yaml
  - authentik-vault-auth.yaml
  - monitoring-namespace.yaml
  - grafana-admin.yaml
  - monitoring-vault-auth.yaml
  - authentik-sso-clients.yaml
  - grafana-oidc.yaml
  - argocd-oidc.yaml
  - grafana-mcp-credentials.yaml
configMapGenerator:
  - name: authentik-sso-blueprints
    namespace: authentik
    files:
      - authentik-sso.yaml
generatorOptions:
  disableNameSuffixHash: true
