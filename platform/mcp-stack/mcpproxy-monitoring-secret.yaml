apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mcpproxy-monitoring-credentials
  namespace: monitoring
spec:
  vaultAuthRef: monitoring
  mount: kv
  path: monitoring/mcpproxy
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: mcpproxy-monitoring-credentials
    overwrite: true
