apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-upstream-proxy
  namespace: vault-access
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client_body_temp;
      proxy_temp_path /tmp/proxy_temp;
      server {
        listen 8080;
        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }
        location / {
          proxy_pass https://vault.home.arpa:8200;
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name vault.home.arpa;
          proxy_ssl_trusted_certificate /etc/vault-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 2;
          proxy_set_header Host vault.home.arpa:8200;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
