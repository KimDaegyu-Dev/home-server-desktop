apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  vaultAuthRef: monitoring
  mount: kv
  path: monitoring/grafana-oidc
  type: kv-v2
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    create: true
    name: grafana-oidc
    overwrite: true
    transformation:
