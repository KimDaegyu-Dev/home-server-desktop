apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kanzo-agent-worker
  namespace: argocd
  labels:
    sourceType: git
    serverSideApply: "false"
    stage: 77-agent-workers
spec:
  project: default
  source:
    repoURL: https://github.com/KimDaegyu-Dev/home-server-desktop.git
    targetRevision: main
    path: platform/kanzo-agent-worker
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
