apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: search
data:
  settings.yml: |
    use_default_settings: true
    search:
      formats:
        - html
        - json
    server:
      bind_address: "0.0.0.0"
      port: 8080
      base_url: false
      limiter: false
      public_instance: false
      secret_key: "replace-me-with-SEARXNG_SECRET"
      image_proxy: false
