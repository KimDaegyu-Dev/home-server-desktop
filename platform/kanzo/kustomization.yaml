apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kanzo.yaml
  - kanzo-ingress.yaml
configMapGenerator:
  - name: kanzo-seed-config
    namespace: kanzo
    files:
      - config.toml
      - fetch-kanzo.py
      - backup-kanzo.py
  - name: kanzo-web-proxy
    namespace: kanzo
    files:
      - default.conf=nginx-kanzo.conf
