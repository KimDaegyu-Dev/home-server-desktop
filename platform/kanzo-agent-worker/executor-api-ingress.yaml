apiVersion: v1
kind: Service
metadata:
  name: kanzo-agent-executor-api
  namespace: mcp
  labels:
    app.kubernetes.io/name: kanzo-agent-executor-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kanzo-agent-executor
  ports:
    - name: executor-api
      port: 8766
      targetPort: executor-api
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanzo-agent-executor-api
  namespace: mcp
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes-executor
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanzo-agent-executor-api
                port:
                  number: 8766
